# Self-hosted Flagsmith with Experimentation, for running Darwin with no Flagsmith account.
# Based on Flagsmith's own docker-compose.yml, pinned to a release that has experiment rollout decisions.
#
#   make flagsmith-up      # start it (dashboard + API on http://localhost:8000)
#   make flagsmith-setup   # create the admin user, project, environment, keys and warehouse
#
# Experiment events are stored in the same Postgres ("Flagsmith database" warehouse). Fine for a demo;
# for production, connect a real warehouse.

name: darwin-flagsmith

x-flagsmith-env: &flagsmith-env
  DATABASE_URL: postgresql://postgres:password@postgres:5432/flagsmith
  USE_POSTGRES_FOR_ANALYTICS: 'true'
  ENVIRONMENT: production
  DJANGO_ALLOWED_HOSTS: '*'
  FLAGSMITH_DOMAIN: localhost:8000
  DJANGO_SECRET_KEY: darwin-local-only-secret
  WAREHOUSE_CREDENTIALS_SECRET: darwin-local-only-secret
  TASK_RUN_METHOD: TASK_PROCESSOR
  PROMETHEUS_ENABLED: 'false'
  EXPERIMENTATION_ENABLED: 'true'

volumes:
  pgdata:

services:
  postgres:
    image: postgres:15.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: flagsmith
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d flagsmith -U postgres']
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 20s

  migrate-db:
    image: flagsmith/flagsmith:2.295.2
    command: [migrate]
    environment:
      <<: *flagsmith-env
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  flagsmith:
    image: flagsmith/flagsmith:2.295.2
    restart: unless-stopped
    command: [serve]
    environment:
      <<: *flagsmith-env
    ports:
      - '8000:8000'
    depends_on:
      migrate-db:
        condition: service_completed_successfully

  flagsmith-task-processor:
    image: flagsmith/flagsmith:2.295.2
    restart: unless-stopped
    command: [run-task-processor]
    environment:
      <<: *flagsmith-env
    depends_on:
      migrate-db:
        condition: service_completed_successfully
