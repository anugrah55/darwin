[project]
name = "darwin-flags"
version = "0.1.0"
description = "Your AI agent evolves in production. Flagsmith decides who survives. You approve every mutation."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Anugrah" }]
keywords = ["flagsmith", "feature-flags", "experimentation", "ai-agents", "llm", "a/b-testing"]
dependencies = [
    "anthropic>=1.0",
    "flagsmith>=6.3.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.scripts]
darwin = "darwin.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["darwin", "shopbot", "sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
