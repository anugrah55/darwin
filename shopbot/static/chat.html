<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acme Outfitters · Support</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e4e1da;
    --accent: #2f6f4f; --accent-ink: #ffffff; --bot: #f0efe9; --me: #2f6f4f; --me-ink: #fff;
    --chip: #ecebe5; --warn: #9a5b00; --ok: #2f6f4f; --bad: #a33a2b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151614; --panel: #1d1e1c; --ink: #ecebe6; --muted: #a09f99; --line: #2e2f2c;
            --accent: #6fbf94; --accent-ink: #0f1a14; --bot: #262724; --me: #3c7d5b; --me-ink: #fff; --chip: #2a2b28; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 20px 16px; display: grid; grid-template-columns: 1fr 300px; gap: 18px; }
  @media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; letter-spacing: .2px; }
  h1 span { color: var(--muted); font-weight: 500; }
  .brain { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--chip); border: 1px solid var(--line);
           padding: 4px 9px; border-radius: 999px; color: var(--muted); }
  .brain b { color: var(--ink); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
  .chat { display: flex; flex-direction: column; height: min(72vh, 720px); }
  .log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 82%; padding: 10px 13px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
  .me { background: var(--me); color: var(--me-ink); align-self: flex-end; border-bottom-right-radius: 4px; }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tool { font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--panel); border: 1px solid var(--line);
          border-radius: 6px; padding: 2px 7px; color: var(--muted); cursor: pointer; }
  .tool.err { color: var(--bad); }
  details.raw { font: 11.5px ui-monospace, Menlo, monospace; color: var(--muted); margin-top: 6px; }
  .system { align-self: center; color: var(--muted); font-size: 13px; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
  input[type=text] { flex: 1; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
  button { font: inherit; border: 0; border-radius: 10px; padding: 9px 14px; cursor: pointer; background: var(--accent); color: var(--accent-ink); }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  button:disabled { opacity: .5; cursor: default; }
  .feedback { display: none; align-items: center; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); color: var(--muted); }
  .feedback.show { display: flex; flex-wrap: wrap; }
  aside { padding: 16px; }
  aside h2 { font-size: 14px; margin: 0 0 10px; }
  .order { border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; margin-bottom: 8px; cursor: pointer; }
  .order:hover { border-color: var(--accent); }
  .order b { font-family: ui-monospace, Menlo, monospace; }
  .order small { display: block; color: var(--muted); }
  .note { color: var(--muted); font-size: 12.5px; margin-top: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <main>
    <header>
      <h1>Acme Outfitters <span>· Support</span></h1>
      <div style="display:flex;gap:8px;align-items:center">
        <span class="brain" id="brain">connecting…</span>
        <button class="ghost" id="new">New chat</button>
      </div>
    </header>
    <div class="panel chat">
      <div class="log" id="log"></div>
      <div class="feedback" id="feedback">Did this solve your problem?
        <button id="yes">Yes</button><button class="ghost" id="no">No</button></div>
      <form id="form"><input type="text" id="text" placeholder="Ask about an order…" autocomplete="off">
        <button id="send">Send</button></form>
    </div>
  </main>
  <aside class="panel">
    <h2>Try one of these orders</h2>
    <div id="orders"></div>
    <p class="note">ShopBot's prompt, model and effort come from the Flagsmith flag <code>shopbot_brain</code>.
      Your Yes/No answer is sent to Flagsmith as the <code>resolved</code> event.</p>
  </aside>
</div>
<script>
const $ = (id) => document.getElementById(id);
let sid = null, busy = false;

function add(cls, text) {
  const el = document.createElement("div");
  el.className = "msg " + cls;
  el.textContent = text;
  $("log").appendChild(el);
  $("log").scrollTop = $("log").scrollHeight;
  return el;
}
function system(text) { const el = document.createElement("div"); el.className = "system"; el.textContent = text; $("log").appendChild(el); }

function toolLabel(t) {
  const a = t.input || {};
  const arg = a.order_id || a.email || a.topic || a.reason || "";
  const extra = t.name === "create_return" ? ` → ${a.resolution}` : t.name === "issue_credit" ? ` $${a.amount_usd}` : "";
  return `${t.name}(${arg})${extra}`;
}

async function start() {
  $("log").innerHTML = ""; $("feedback").classList.remove("show");
  $("text").disabled = false; $("send").disabled = false;
  const r = await fetch("/chat/start", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ channel: "web" }) });
  const s = await r.json();
  sid = s.session_id;
  const exp = s.in_experiment ? ` · experiment #${s.experiment_id}` : "";
  $("brain").innerHTML = `brain <b>${s.generation}</b> · ${s.variant}${exp}`;
  add("bot", "Hi! I'm ShopBot. How can I help with your order today?");
  $("text").focus();
}

async function send(text) {
  if (!sid || busy || !text.trim()) return;
  busy = true; $("send").disabled = true;
  add("me", text);
  const typing = add("bot", "…");
  try {
    const r = await fetch(`/chat/${sid}/message`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) });
    const d = await r.json();
    if (!r.ok) { typing.textContent = d.detail || "Something went wrong."; return; }
    typing.textContent = d.reply;
    if (d.tools && d.tools.length) {
      const box = document.createElement("div"); box.className = "tools";
      d.tools.forEach((t) => {
        const chip = document.createElement("span"); chip.className = "tool" + (t.is_error ? " err" : "");
        chip.textContent = toolLabel(t); chip.title = JSON.stringify(t.output, null, 1);
        box.appendChild(chip);
      });
      typing.appendChild(box);
    }
    $("feedback").classList.add("show");
    if (d.escalated) system("Handed to a human specialist.");
  } finally { busy = false; $("send").disabled = false; }
}

async function end(resolved) {
  if (!sid) return;
  await fetch(`/chat/${sid}/end`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ resolved }) });
  system(resolved ? "Thanks! Sent to Flagsmith as resolved." : "Thanks for telling us. Sent to Flagsmith as not resolved.");
  $("feedback").classList.remove("show"); $("text").disabled = true; $("send").disabled = true; sid = null;
}

$("form").addEventListener("submit", (e) => { e.preventDefault(); const t = $("text").value; $("text").value = ""; send(t); });
$("yes").onclick = () => end(true); $("no").onclick = () => end(false); $("new").onclick = start;

fetch("/api/demo-orders").then((r) => r.json()).then((orders) => {
  orders.forEach((o) => {
    const el = document.createElement("div"); el.className = "order";
    const when = o.delivered_on ? `delivered ${o.delivered_days_ago} days ago` : `${o.status}, ${o.days_late} days late`;
    el.innerHTML = `<b>${o.order_id}</b> · $${o.order_total}<small>${o.items.map((i) => i.name).join(", ")} — ${when}</small><small>${o.email}</small>`;
    el.onclick = () => { $("text").value = `Hi, it's about order ${o.order_id}. `; $("text").focus(); };
    $("orders").appendChild(el);
  });
});
start();
</script>
</body>
</html>
